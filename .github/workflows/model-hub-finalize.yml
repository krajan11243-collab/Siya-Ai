name: Finalize Model Hub UI

on:
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply the prepared model-hub screen
        shell: python
        run: |
          from pathlib import Path
          import re
          src = Path('app/src/main/java/com/siya/ai/ui/SiyaResponsiveApp.kt')
          wf = Path('.github/workflows/apply-model-hub.yml').read_text()
          m = re.search(r"replacement = r'''(.*?)'''", wf, re.S)
          if not m:
              raise SystemExit('Prepared model-hub replacement not found')
          replacement = m.group(1)
          s = src.read_text()
          for line, after in [
              ('import androidx.compose.foundation.background\n', 'import androidx.compose.foundation.BorderStroke\n'),
              ('import androidx.compose.ui.graphics.Brush\n', 'import androidx.compose.ui.graphics.Color\n'),
              ('import androidx.compose.ui.draw.shadow\n', 'import androidx.compose.ui.draw.clip\n'),
              ('import androidx.compose.ui.window.Dialog\n', 'import androidx.compose.ui.unit.sp\n'),
          ]:
              if line not in s:
                  s = s.replace(after, after + line + '\n')
          start = s.index('@Composable\nprivate fun ResponsiveModels')
          end = s.index('@Composable private fun ModelCard', start)
          src.write_text(s[:start] + replacement + s[end:])
      - name: Commit source update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/siya/ai/ui/SiyaResponsiveApp.kt
          if git diff --cached --quiet; then
            echo "Model hub source already matches prepared UI."
            exit 0
          fi
          git commit -m "[model-hub] apply AI model hub redesign"
          git push
