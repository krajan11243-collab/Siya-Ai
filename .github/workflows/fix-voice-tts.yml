name: Fix Voice TTS
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch TTS and voice loop
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/siya/ai/service/LocalTtsEngine.kt')
          s = p.read_text()
          old_speak = """        if (neural.isInstalled()) {
            neuralJob = worker.submit {
                runCatching {
                    val generation = neural.startGeneration(settings.speechRate)
                    chunkText(text).forEach { chunk ->
                        if (!neural.generateChunk(chunk, generation, settings.speechRate)) return@submit
                    }
                }.onFailure {
                    // A present-but-broken neural model must never make Siya silent.
                    // Fall back to Android's device-local TTS for this reply.
                    speakAndroidFallback(text)
                }
            }
            return
        }
        if (!ready) {
            pendingSpeech = text
            return
        }
        chunkText(text).forEachIndexed { index, chunk ->
            tts?.speak(chunk, if (index == 0) TextToSpeech.QUEUE_FLUSH else TextToSpeech.QUEUE_ADD, null, "siya-${System.nanoTime()}-$index")
        }"""
          new_speak = """        if (neural.isInstalled()) {
            neuralJob = worker.submit {
                var success = false
                runCatching {
                    val generation = neural.startGeneration(settings.speechRate)
                    success = true
                    for (chunk in chunkText(text)) {
                        if (!neural.generateChunk(chunk, generation, settings.speechRate)) {
                            success = false
                            break
                        }
                    }
                }.onFailure { success = false }
                if (!success) speakAndroidFallback(text)
            }
            return
        }
        speakAndroidFallback(text)"""
          if old_speak not in s:
              raise SystemExit('LocalTtsEngine speak block not found')
          s = s.replace(old_speak, new_speak)
          s = s.replace("""        if (ready) {
            val pending = synchronized(this) { pendingSpeech.also { pendingSpeech = null } }
            if (!pending.isNullOrBlank()) speak(pending)
        }""", """        if (ready) {
            val pending = synchronized(this) { pendingSpeech.also { pendingSpeech = null } }
            if (!pending.isNullOrBlank()) speakAndroidFallback(pending)
        }""")
          old_stream = """        if (neural.isInstalled()) {
            val generation = streamingGeneration ?: neural.startGeneration(settings.speechRate).also { streamingGeneration = it }
            neuralJob = worker.submit {
                runCatching { neural.generateChunk(text.trim(), generation, settings.speechRate) }
                    .onFailure {
                        // Keep the same text flowing through the local Android TTS path.
                        speakAndroidChunk(text.trim(), TextToSpeech.QUEUE_ADD)
                    }
            }
            return true
        }"""
          new_stream = """        if (neural.isInstalled()) {
            val generation = streamingGeneration ?: runCatching {
                neural.startGeneration(settings.speechRate)
            }.getOrNull().also { streamingGeneration = it }
            if (generation == null) {
                speakAndroidChunk(text.trim(), TextToSpeech.QUEUE_ADD)
                return ready
            }
            neuralJob = worker.submit {
                var ok = false
                runCatching { ok = neural.generateChunk(text.trim(), generation, settings.speechRate) }
                if (!ok) speakAndroidChunk(text.trim(), TextToSpeech.QUEUE_ADD)
            }
            return true
        }"""
          if old_stream not in s:
              raise SystemExit('LocalTtsEngine stream block not found')
          s = s.replace(old_stream, new_stream)
          p.write_text(s)

          p = Path('app/src/main/java/com/siya/ai/service/SiyaVoiceService.kt')
          s = p.read_text()
          s = s.replace('''    private var firstTtsChunk = true
''', '''    private var firstTtsChunk = true
    @Volatile private var suppressVadUntilMs = 0L
''')
          s = s.replace('tts?.speak(recovery)', 'speakResponse(recovery)')
          s = s.replace('tts?.speak(prompt)', 'speakResponse(prompt)')
          s = s.replace('tts?.streamChunk(chunk)', 'speakStreamChunk(chunk)')
          s = s.replace('tts?.streamChunk(remaining)', 'speakStreamChunk(remaining)')
          s = s.replace('tts?.speak(message)', 'speakResponse(message)')
          marker = '''    private fun onPcm(buffer: ShortArray, length: Int) {
'''
          helper = '''    private fun estimateTtsGuardMs(text: String): Long {
        return (1_200L + text.length.coerceAtMost(180) * 110L).coerceAtMost(21_000L)
    }

    private fun guardVadDuringTts(text: String) {
        val until = System.currentTimeMillis() + estimateTtsGuardMs(text)
        if (until > suppressVadUntilMs) suppressVadUntilMs = until
    }

    private fun speakResponse(text: String) {
        if (text.isBlank()) return
        guardVadDuringTts(text)
        tts?.speak(text)
    }

    private fun speakStreamChunk(text: String) {
        if (text.isBlank()) return
        guardVadDuringTts(text)
        tts?.streamChunk(text)
    }

    private fun onPcm(buffer: ShortArray, length: Int) {
'''
          if marker not in s:
              raise SystemExit('SiyaVoiceService onPcm marker not found')
          s = s.replace(marker, helper, 1)
          marker2 = '''        val copy = buffer.copyOf(length)
        // Keep audio append + VAD event handling on the same serial worker.
'''
          repl2 = '''        if (System.currentTimeMillis() < suppressVadUntilMs) return
        val copy = buffer.copyOf(length)
        // Keep audio append + VAD event handling on the same serial worker.
'''
          if marker2 not in s:
              raise SystemExit('SiyaVoiceService PCM marker not found')
          s = s.replace(marker2, repl2, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/siya/ai/service/LocalTtsEngine.kt app/src/main/java/com/siya/ai/service/SiyaVoiceService.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair voice reply TTS and self-hearing loop [voice-tts-fix]"
          git push
