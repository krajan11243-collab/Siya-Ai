name: Fix Model Hub Build
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[model-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Compose argument ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/siya/ai/ui/SiyaResponsiveApp.kt')
          s = p.read_text()
          s = s.replace(', Panel, BorderStroke(', ', Panel, border = BorderStroke(')
          s = s.replace(',CircleShape,accent.copy(.08f),BorderStroke(', ',CircleShape,color=accent.copy(.08f),border=BorderStroke(')
          s = s.replace('OutlinedButton({requirements=true},Modifier.fillMaxWidth().height(48.dp),RoundedCornerShape(14.dp),BorderStroke(1.dp,Blue.copy(.6f)))', 'OutlinedButton(onClick={requirements=true}, modifier=Modifier.fillMaxWidth().height(48.dp), shape=RoundedCornerShape(14.dp), border=BorderStroke(1.dp,Blue.copy(.6f)))')
          s = s.replace('enabled=!busy&&!llmInstalled&&!downloadActive,RoundedCornerShape(14.dp),ButtonDefaults.buttonColors(containerColor=Purple)', 'enabled=!busy&&!llmInstalled&&!downloadActive,shape=RoundedCornerShape(14.dp),colors=ButtonDefaults.buttonColors(containerColor=Purple)')
          s = s.replace('enabled=!busy&&(!vadInstalled||!sttInstalled),RoundedCornerShape(14.dp))', 'enabled=!busy&&(!vadInstalled||!sttInstalled),shape=RoundedCornerShape(14.dp))')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/siya/ai/ui/SiyaResponsiveApp.kt
          git diff --cached --quiet && exit 0
          git commit -m "[model-fix] fix model hub Compose build"
          git push
