name: Fix Model Hub Build
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[model-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix remaining Compose Surface arguments
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/siya/ai/ui/SiyaResponsiveApp.kt')
          s = p.read_text()
          s = s.replace(',Panel,BorderStroke(', ',Panel,border=BorderStroke(')
          s = s.replace(', Panel, BorderStroke(', ', Panel, border=BorderStroke(')
          p.write_text(s)
          PY
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/siya/ai/ui/SiyaResponsiveApp.kt
          git diff --cached --quiet && exit 0
          git commit -m "[model-fix] correct remaining Surface border arguments"
          git push