name: Android CI

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify stable APK signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="app/build/ci/siya-debug.keystore"
          test -f "$KEYSTORE"
          FINGERPRINT="$(keytool -list -v -keystore "$KEYSTORE" -storepass siya1234 -alias siya-debug | awk -F': ' '/SHA256:/{print $2; exit}')"
          EXPECTED="19:91:AD:EF:A2:6D:53:DE:C1:16:11:E9:C1:76:BB:F7:E0:0B:F4:02:DE:2C:36:7D:10:BF:B6:4B:DA:14:C2:AA"
          test "$FINGERPRINT" = "$EXPECTED"
          echo "Stable signing certificate: $FINGERPRINT"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: siya-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish latest debug APK release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="voice-diagnostics-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk               --title "Siya Ai Voice Diagnostics (latest)"               --notes "Debug APK with live phone-side voice diagnostics. Test build only."
          fi
