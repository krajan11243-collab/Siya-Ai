name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_run:
    workflows: ["Finalize Model Hub UI"]
    types: [completed]

jobs:
  test:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply CI build fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/siya/ai/ui/SiyaResponsiveAppV2.kt')
          s = p.read_text()
          s = s.replace('Icons.Default.Cube', 'Icons.Default.Memory')
          s = s.replace('fontSize = if (maxWidth < 360.dp) 25.sp else 29.sp', 'fontSize = 27.sp')
          p.write_text(s)

          p = Path('app/build.gradle.kts')
          s = p.read_text()
          dep = '    implementation("com.microsoft.onnxruntime:onnxruntime-android:1.29.0")\n'
          if 'com.microsoft.onnxruntime:onnxruntime-android' not in s:
              marker = '    implementation("com.github.k2-fsa.sherpa-onnx:sherpa-onnx:v1.13.8")\n'
              s = s.replace(marker, dep + marker)
          if 'jniLibs {' not in s:
              marker = '    packaging { resources.excludes += "/META-INF/{AL2.0,LGPL2.1}" }'
              replacement = '''    packaging {\n        resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"\n        jniLibs {\n            pickFirsts += "lib/arm64-v8a/libonnxruntime.so"\n            pickFirsts += "lib/armeabi-v7a/libonnxruntime.so"\n            pickFirsts += "lib/x86/libonnxruntime.so"\n            pickFirsts += "lib/x86_64/libonnxruntime.so"\n        }\n    }'''
              s = s.replace(marker, replacement)
          p.write_text(s)
          PY
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify stable APK signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="app/build/ci/siya-debug.keystore"
          test -f "$KEYSTORE"
          FINGERPRINT="$(keytool -list -v -keystore "$KEYSTORE" -storepass siya1234 -alias siya-debug | awk -F': ' '/SHA256:/{print $2; exit}')"
          EXPECTED="19:91:AD:EF:A2:6D:53:DE:C1:16:11:E9:C1:76:BB:F7:E0:0B:F4:02:DE:2C:36:7D:10:BF:B6:4B:DA:14:C2:AA"
          test "$FINGERPRINT" = "$EXPECTED"
          echo "Stable signing certificate: $FINGERPRINT"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: siya-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
